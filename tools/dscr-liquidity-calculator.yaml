name: dscr-liquidity-calculator
version: 1.0.0
description: "Calculates Debt Service Coverage Ratio from Net Operating Income and annual debt service"
input_schema:
  type: object
  properties:
    financials_json:
      type: string
      description: "JSON with noi_usd and annual_debt_service_usd"
  required:
    - financials_json
implementation:
  type: script
  path: dscr_liquidity_calculator.py
  runtime: python3
annotations:
  read_only: true
  idempotent: true
