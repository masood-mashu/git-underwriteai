name: "dscr-liquidity-calculator"
description: "Calculates Debt Service Coverage Ratio from Net Operating Income and annual debt service"
version: "0.1.0"
runtime:
  language: "python"
  entrypoint: "dscr_liquidity_calculator.py"
parameters:
  type: "object"
  properties:
    financials_json:
      type: "string"
      description: "JSON with noi_usd and annual_debt_service_usd"
  required:
    - "financials_json"
