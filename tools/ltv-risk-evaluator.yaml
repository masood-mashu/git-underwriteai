name: ltv-risk-evaluator
version: 1.0.0
description: "Calculates Loan-to-Value percentage against certified collateral appraisal"
input_schema:
  type: object
  properties:
    collateral_json:
      type: string
      description: "JSON with loan_amount_usd and appraised_value_usd"
  required:
    - collateral_json
implementation:
  type: script
  path: ltv_risk_evaluator.py
  runtime: python3
annotations:
  read_only: true
  idempotent: true
