spec_version: "0.1.0"
name: git-underwriteai
version: 1.0.0
description: "Autonomous Commercial Lending Underwriting, DSCR Liquidity & Credit Risk Evaluation Agent"
author: "masood-mashu"
license: "Apache-2.0"

model:
  preferred: "openai:gpt-4o"
  fallback:
    - "anthropic:claude-3-5-sonnet"
    - "openai:gpt-4o-mini"
  constraints:
    temperature: 0.1
    max_tokens: 4096

skills:
  - commercial-underwriting-standards
  - cash-flow-sensitivity-stressing

tools:
  - dscr-liquidity-calculator
  - ltv-risk-evaluator
  - credit-spread-benchmarker

runtime:
  max_turns: 50
  timeout: 120

tags:
  - finance
  - commercial-lending
  - credit-risk
  - dscr-calculation
  - passport-challenge

metadata:
  passport_id: "aps-underwriteai-01"
  passport_category: "Finance"
